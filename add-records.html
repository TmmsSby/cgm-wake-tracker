<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>レコード追加ツール | CGM</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; background: #f5f4f0; }
    .card { background: #fff; border-radius: 10px; padding: 1.5rem; }
    h1 { font-size: 18px; margin-bottom: 0.5rem; }
    p { font-size: 13px; color: #666; line-height: 1.7; margin-bottom: 1rem; }
    button { padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #log { background: #1a1a1a; color: #e5e7eb; border-radius: 6px; padding: 1rem; height: 260px; overflow-y: auto; font-size: 13px; font-family: monospace; margin-top: 1rem; white-space: pre-wrap; }
    #work { display: none; }
    .note { background: #fffbeb; border-left: 3px solid #b45309; padding: 10px 12px; font-size: 12px; color: #78350f; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>レコード追加ツール</h1>
    <p>スプレッドシートに残っていた2名分（28件）をFirestoreに追加します。既存データは削除しません。</p>

    <div class="note">
      実行前にFirestoreのルールを管理者フルアクセスに変更してください。終わったら必ず元に戻してください。
    </div>

    <div id="login">
      <button id="login-btn" onclick="doLogin()">管理者Googleログイン</button>
    </div>

    <div id="work">
      <p id="who" style="color:#16a34a;font-weight:bold;"></p>
      <button id="run-btn" onclick="doRun()">28件を追加する</button>
      <div id="log"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore, doc, getDoc, writeBatch, collection }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyD0FXYbX7ck2RduoSI6w8oUdabQWsBW16U",
      authDomain: "cgm-wake-tracker.firebaseapp.com",
      projectId: "cgm-wake-tracker",
      storageBucket: "cgm-wake-tracker.firebasestorage.app",
      messagingSenderId: "337536228102",
      appId: "1:337536228102:web:af75a83cff745a878d1c87"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // スプレッドシートに取り残されていたデータ
    const RAW = `
bride0925@gmail.com	2026-09-01	3:59
zenregule@gmail.com	2026-08-30	3:00
zenregule@gmail.com	2026-08-31	4:55
zenregule@gmail.com	2026-09-01	3:00
bride0925@gmail.com	2026-09-02	4:28
zenregule@gmail.com	2026-09-02	3:00
bride0925@gmail.com	2026-09-03	4:29
zenregule@gmail.com	2026-09-03	4:55
bride0925@gmail.com	2026-09-04	3:58
bride0925@gmail.com	2026-09-05	3:44
zenregule@gmail.com	2026-09-04	3:00
zenregule@gmail.com	2026-09-05	3:00
zenregule@gmail.com	2026-09-06	3:00
bride0925@gmail.com	2026-09-06	3:58
bride0925@gmail.com	2026-09-07	3:05
bride0925@gmail.com	2026-09-08	4:09
bride0925@gmail.com	2026-09-09	4:08
bride0925@gmail.com	2026-09-10	4:27
zenregule@gmail.com	2026-09-07	3:00
zenregule@gmail.com	2026-09-08	3:00
zenregule@gmail.com	2026-09-09	5:00
zenregule@gmail.com	2026-09-10	5:00
bride0925@gmail.com	2026-09-11	4:36
bride0925@gmail.com	2026-09-12	4:14
zenregule@gmail.com	2026-09-11	3:00
zenregule@gmail.com	2026-09-12	3:00
zenregule@gmail.com	2026-09-13	7:00
zenregule@gmail.com	2026-09-14	4:20
`;

    function log(msg, type) {
      const el = document.getElementById('log');
      const color = type === 'error' ? '#f87171' : type === 'success' ? '#4ade80' : '#e5e7eb';
      el.innerHTML += `<div style="color:${color}">${msg}</div>`;
      el.scrollTop = el.scrollHeight;
    }

    function parse(text) {
      const out = {};
      text.split('\n').forEach(line => {
        const p = line.split('\t');
        if (p.length < 3) return;
        const email = p[0].trim();
        const date = p[1].trim();
        const prayTime = p[2].trim();
        if (!email.includes('@')) return;
        if (!date.includes('-') || date.length !== 10) return;
        if (!prayTime.includes(':')) return;
        out[email + '_' + date] = { email, date, prayTime };
      });
      return out;
    }

    window.doLogin = async function() {
      document.getElementById('login-btn').disabled = true;
      try {
        const res = await signInWithPopup(auth, provider);
        document.getElementById('login').style.display = 'none';
        document.getElementById('work').style.display = 'block';
        document.getElementById('who').textContent = 'ログイン済み: ' + res.user.email;
      } catch (e) {
        alert('ログイン失敗: ' + e.message);
        document.getElementById('login-btn').disabled = false;
      }
    };

    window.doRun = async function() {
      const btn = document.getElementById('run-btn');
      btn.disabled = true;
      try {
        const records = parse(RAW);
        const entries = Object.entries(records);
        log(`対象: ${entries.length}件`);

        // メンバー登録の有無を確認
        const emails = [...new Set(entries.map(([, v]) => v.email))];
        for (const em of emails) {
          const snap = await getDoc(doc(db, 'members', em));
          if (snap.exists()) {
            log(`  ${em} → 登録済み（${snap.data().name}）`);
          } else {
            log(`  ${em} → membersに未登録。初回ログイン時に登録画面が出ます`, 'error');
          }
        }

        const batch = writeBatch(db);
        entries.forEach(([id, d]) => {
          batch.set(doc(db, 'records', id), {
            email: d.email,
            date: d.date,
            prayTime: d.prayTime,
            recordedAt: new Date().toISOString()
          });
        });
        await batch.commit();
        log(`${entries.length}件の追加が完了しました`, 'success');
        log('Firestoreのルールを元に戻してください。', 'success');
      } catch (e) {
        log('エラー: ' + (e.code || '') + ' ' + e.message, 'error');
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
